<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pix • Revolution</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:white;width:min(420px,90%);padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001;text-align:center}
h1{margin-top:0}.pix{font-size:14px;color:#555;margin-bottom:20px}
input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:18px;margin:8px 0 14px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#111;color:#fff;font-size:17px;cursor:pointer}
#qr{margin:22px auto 10px;width:260px;min-height:20px} .copy{background:#eee;color:#111;margin-top:8px}
.small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="card">
<h1>💳 Pague por Pix</h1>
<div class="pix">Recebedor: <b>REVOLUTION</b></div>
<label>Digite o valor</label>
<input id="valor" inputmode="decimal" placeholder="Ex.: 25,00">
<button onclick="gerar()">Gerar QR Code Pix</button>
<div id="qr"></div>
<button class="copy" id="copiar" style="display:none" onclick="copiarPix()">Copiar código Pix</button>
<p class="small">Confira o nome do recebedor no aplicativo do seu banco antes de pagar.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const chave="17177086684";
let payloadAtual="";
function campo(id,v){return id+String(v.length).padStart(2,"0")+v}
function crc16(s){
 let crc=0xFFFF;
 for(let i=0;i<s.length;i++){
   crc ^= s.charCodeAt(i)<<8;
   for(let j=0;j<8;j++) crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;
 }
 return crc.toString(16).toUpperCase().padStart(4,"0");
}
function pix(valor){
 const merchant = campo("00","BR.GOV.BCB.PIX")+campo("01",campo("00",chave));
 const mai = campo("26",merchant);
 const body =
   campo("00","01") +
   campo("01","12") +
   mai +
   campo("52","0000") +
   campo("53","986") +
   campo("54",valor) +
   campo("58","BR") +
   campo("59","REVOLUTION") +
   campo("60","REVOLUTION") +
   campo("62",campo("05","***"));
 return body+"6304"+crc16(body+"6304");
}
function normalizar(v){
 v=v.replace(/[^\d,\.]/g,"").replace(",",".");
 const n=Number(v);
 return Number.isFinite(n)&&n>0?n.toFixed(2):null;
}
function gerar(){
 const v=normalizar(document.getElementById("valor").value);
 if(!v){alert("Digite um valor válido.");return;}
 payloadAtual=pix(v);
 const q=document.getElementById("qr"); q.innerHTML="";
 new QRCode(q,{text:payloadAtual,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
 document.getElementById("copiar").style.display="block";
}
function copiarPix(){
 navigator.clipboard.writeText(payloadAtual).then(()=>alert("Código Pix copiado!"));
}
</script>
</body>
</html>
